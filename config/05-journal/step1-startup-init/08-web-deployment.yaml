apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-web
  namespace: tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: journal-web
  template:
    metadata:
      labels:
        app: journal-web
        tier: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /journal/
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /journal/
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: web-assets
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: web-assets
              mountPath: /usr/share/nginx/html/app.js
              subPath: app.js
            - name: web-assets
              mountPath: /usr/share/nginx/html/styles.css
              subPath: styles.css
      volumes:
        - name: nginx-conf
          configMap:
            name: journal-nginx-conf
        - name: web-assets
          configMap:
            name: journal-web-assets
