apiVersion: v1
kind: ConfigMap
metadata:
  name: journal-nginx-conf
  namespace: tutorial
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location = / {
            return 302 /journal/;
        }

        location /journal/api/ {
            proxy_pass http://journal-api:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /journal/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /index.html;
        }
    }
