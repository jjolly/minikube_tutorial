apiVersion: apps/v1
kind: Deployment
metadata:
  name: genkey-api
  namespace: tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genkey-api
  template:
    metadata:
      labels:
        app: genkey-api
        tier: api
    spec:
      containers:
        - name: api
          image: genkey-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: genkey-api
  namespace: tutorial
spec:
  selector:
    app: genkey-api
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genkey-web
  namespace: tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genkey-web
  template:
    metadata:
      labels:
        app: genkey-web
        tier: web
    spec:
      containers:
        - name: nginx
          image: genkey-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /genkey/
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /genkey/
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: genkey-web
  namespace: tutorial
spec:
  selector:
    app: genkey-web
  ports:
    - port: 80
      targetPort: 80
