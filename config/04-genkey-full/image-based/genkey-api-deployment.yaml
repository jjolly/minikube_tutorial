apiVersion: apps/v1
kind: Deployment
metadata:
  name: genkey-api
  namespace: tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genkey-api
  template:
    metadata:
      labels:
        app: genkey-api
        tier: api
    spec:
      containers:
        - name: api
          image: genkey-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
