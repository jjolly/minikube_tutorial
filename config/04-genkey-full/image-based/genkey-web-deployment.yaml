apiVersion: apps/v1
kind: Deployment
metadata:
  name: genkey-web
  namespace: tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genkey-web
  template:
    metadata:
      labels:
        app: genkey-web
        tier: web
    spec:
      containers:
        - name: nginx
          image: genkey-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /genkey/
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /genkey/
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
