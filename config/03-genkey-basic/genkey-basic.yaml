apiVersion: v1
kind: ConfigMap
metadata:
  name: genkey-basic-nginx-conf
  namespace: tutorial
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location / {
            return 200 'Try /genkey\n';
            add_header Content-Type text/plain;
        }

        location /genkey {
            proxy_pass http://genkey-basic-api:5000/genkey;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genkey-basic-api
  namespace: tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genkey-basic-api
  template:
    metadata:
      labels:
        app: genkey-basic-api
        tier: api
    spec:
      containers:
        - name: api
          image: genkey-basic-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: genkey-basic-api
  namespace: tutorial
spec:
  selector:
    app: genkey-basic-api
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genkey-basic-proxy
  namespace: tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genkey-basic-proxy
  template:
    metadata:
      labels:
        app: genkey-basic-proxy
        tier: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: genkey-basic-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: genkey-basic-proxy
  namespace: tutorial
spec:
  selector:
    app: genkey-basic-proxy
  ports:
    - port: 80
      targetPort: 80
